appId: com.dreamnight.uipin
productName: BugShot
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - "!node_modules/**/*"
win:
  target:
    - nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BugShot
mac:
  target:
    - dmg
  icon: resources/icon.icns
linux:
  target:
    - AppImage
  icon: resources/icon.png
publish:
  provider: github
  owner: dreamnight16
  repo: bugshot
